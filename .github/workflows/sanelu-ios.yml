name: Sanelu iOS build

on:
  push:
    branches: [feature/finnish-ios-keyboard]
    paths:
      - 'iOS-FinnishKeyboard/**'
      - '.github/workflows/sanelu-ios.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate Xcode project
        working-directory: iOS-FinnishKeyboard
        run: xcodegen generate
      - name: Build for iOS Simulator
        working-directory: iOS-FinnishKeyboard
        run: >-
          xcodebuild -project Sanelu.xcodeproj -scheme Sanelu
          -destination 'generic/platform=iOS Simulator'
          CODE_SIGNING_ALLOWED=NO build
